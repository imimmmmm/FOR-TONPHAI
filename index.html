<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Stock System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: #ffe600;
            --border-color: #000000;
            --btn-in: #00e676;
            --btn-out: #ff5252;
            --shadow: 4px 4px 0px #000000;
            --shadow-sm: 2px 2px 0px #000000;
        }

        body {
            background-image: url('https://wallpaperaccess.com/full/7943794.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .arcade-cabinet {
            background: var(--panel-bg);
            border: 4px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 580px;
            padding: 24px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .header-title {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            padding: 10px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            color: #000;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 5px;
            font-size: 14px;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #000000 !important;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        select option {
            color: #000000;
            background: #ffffff;
        }

        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
            padding-right: 30px;
        }

        .multi-item-container {
            background: #fff;
            border: 3px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-sm);
        }

        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .pixel-btn-sm {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            font-family: 'Prompt', sans-serif;
            font-weight: 800;
            cursor: pointer;
            background: #ff5252;
            color: white;
            box-shadow: 2px 2px 0px #000;
        }

        .pixel-btn-sm:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .pixel-btn {
            border: 3px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow);
            text-transform: uppercase;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        /* ปรับปุ่มซื้อมาใหม่ๆๆ ให้ตัวหนังสือเป็นสีดำชัดเจน */
        .btn-in-action { background-color: var(--btn-in); color: #000000; }
        .btn-out-action { background-color: var(--btn-out); color: #ffffff; }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            min-height: 24px;
        }

        .inventory-box {
            background: #ffffff;
            border: 4px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 580px;
            padding: 20px;
            box-sizing: border-box;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .inventory-box h3 {
            margin: 0;
            font-weight: 800;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 2px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #ffeb3b;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="header-title">
            <h1>สต็อกเทปของที่รักอ้วน</h1>
        </div>

        <form id="stockForm">
            <div class="form-group">
                <label for="staff">ใครทำเนี่ยย:</label>
                <input type="text" id="staff" required placeholder="แกเปงใครร...">
            </div>

            <div class="form-group">
                <label for="jobName">งานไหนเอ่ยย:</label>
                <input type="text" id="jobName" required placeholder="ชื่องานไรร">
            </div>

            <div class="form-group">
                <label>เลือกรายการของ:</label>
                <div class="multi-item-container" id="itemListContainer"></div>
                <button type="button" class="pixel-btn" style="width: 100%; background: #fff; color: #000; font-size: 14px; padding: 12px; box-shadow: var(--shadow-sm);" onclick="addItemRow()">➕ เพิ่มรายการของอีก</button>
            </div>

            <div class="btn-container">
                <button type="button" class="pixel-btn btn-in-action" onclick="submitStock('IN')">ซื้อมาใหม่ๆๆ</button>
                <button type="button" class="pixel-btn btn-out-action" onclick="submitStock('OUT')">เอาออกไปงานนน</button>
            </div>
        </form>

        <div id="status-message"></div>
    </div>

    <div class="inventory-box">
        <div class="inventory-header">
            <h3>ของที่เหลือในสต้อกงับ</h3>
            <button class="pixel-btn" style="font-size: 11px; padding: 6px 12px; background: #00e676; color: #000000; box-shadow: var(--shadow-sm);" onclick="loadInventory()">🔄 รีเฟรช</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>มีไรบ้างง</th>
                    <th style="width: 80px; text-align: center;">เหลือเท่านี้นะ</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <tr><td colspan="2" style="text-align: center;">กำลังโหลดรอแปปนะอ้วนน...</td></tr>
            </tbody>
        </table>
    </div>
    
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxh5d3kPOWGU8LAOIyRavZi4KXqd1XH8CgD7xEOypxwDbn6C5J3qEM1zpEGbSgiVLCy/exec";

        const itemOptions = [
            "แล็คซีนสีเงิน", "แล็คซีนสีดำ", "แล็คซีนสีน้ำตาลเข้ม", "แล็คซีนสีน้ำตาลอ่อน", "แล็คซีนสีขาว",
            "เทปกาวนิตโต้ 2 นิ้ว", "เทปกาวนิตโต้ 1 นิ้ว", "เทปมาร์คสีเหลือง", "เทปมาร์คสีน้ำเงิน",
            "เทปมาร์คสีแดง", "เทปมาร์คสีดำ", "เทปเหลือง - ดำ", "เทปขาว - แดง", "สก็อตเทป",
            "ที่กั้นเหลือง - ดำ", "เทปพันสายไฟ", "GW 300 HD", "GW 370 HD", "GW 250 ST"
        ];

        function addItemRow() {
            const container = document.getElementById('itemListContainer');
            const row = document.createElement('div');
            row.className = 'item-row';
            
            let optionsHtml = `<option value="" disabled selected>-- เลือกของ --</option>`;
            itemOptions.forEach(item => {
                optionsHtml += `<option value="${item}">${item}</option>`;
            });

            let qtyOptionsHtml = ``;
            for (let i = 1; i <= 100; i++) {
                qtyOptionsHtml += `<option value="${i}">${i}</option>`;
            }

            row.innerHTML = `
                <select class="item-select" required>${optionsHtml}</select>
                <select class="item-qty" required>${qtyOptionsHtml}</select>
                <button type="button" class="pixel-btn-sm" onclick="removeItemRow(this)">X</button>
            `;
            container.appendChild(row);
        }

        function removeItemRow(btn) {
            const rows = document.querySelectorAll('.item-row');
            if (rows.length > 1) {
                btn.parentElement.remove();
            } else {
                alert("ต้องมีอย่างน้อย 1 รายการน้าา!");
            }
        }

        async function loadInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="2" style="text-align: center;">ยังไม่มีข้อมูลในสต็อกงับ</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${item.name}</td><td style="text-align: center; font-weight: 800;">${item.qty}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: red;">แงง โหลดไม่ได้งะะ</td></tr>`;
            }
        }

        async function submitStock(action) {
            const staff = document.getElementById('staff').value;
            const jobName = document.getElementById('jobName').value;
            const statusDiv = document.getElementById('status-message');

            if (!staff || !jobName) {
                statusDiv.style.color = "red";
                statusDiv.textContent = "กรอกชื่อคนทำกับชื่องานก่อนนะจ๊ะ!";
                return;
            }

            const itemRows = document.querySelectorAll('.item-row');
            const items = [];

            for (let row of itemRows) {
                const itemName = row.querySelector('.item-select').value;
                const qty = row.querySelector('.item-qty').value;

                if (!itemName || !qty) {
                    statusDiv.style.color = "red";
                    statusDiv.textContent = "เลือกของและใส่จำนวนให้ครบทุกช่องด้วยน้า!";
                    return;
                }

                items.push({
                    itemName: itemName,
                    qty: parseInt(qty)
                });
            }

            statusDiv.style.color = "blue";
            statusDiv.textContent = "กำลังบันทึกข้อมูลรัวๆ...";

            const payload = {
                action: action,
                staff: staff + ' (งาน: ' + jobName + ')',
                items: items
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                statusDiv.style.color = "green";
                statusDiv.textContent = "บันทึกสำเร็จเรียบร้อยแล้วค้าบบ!";
                
                document.getElementById('jobName').value = '';
                document.getElementById('itemListContainer').innerHTML = '';
                addItemRow();
                
                setTimeout(loadInventory, 1500);

            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.textContent = "แอ้ดแอ่ดด: " + error.message;
            }
        }

        window.onload = function() {
            addItemRow();
            loadInventory();
        };
    </script>
</body>
</html>
